<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#070707">
<meta property="og:title" content="Mariam Gadalla — AI Engineer">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Deliberate single-look design: black and gold in every theme. */
  :root{
    color-scheme:dark;
    --gold:#c9a86a; --gold-hi:#f2ddb0; --gold-dim:#8b7440;
    --edge:#c9a86a38; --edge-soft:#c9a86a1f; --tint:#c9a86a0f;
    --bg:#060606; --bg-2:#111010;
    --card:#0c0c0c; --ink:#f6f2ea; --muted:#9a927f;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100svh; padding:28px 18px;
    background:radial-gradient(130% 80% at 50% 0%, var(--bg-2), var(--bg) 65%);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; align-items:center; justify-content:center;
  }

  .card{
    width:100%; max-width:390px; background:var(--card);
    border:1px solid var(--edge); border-radius:24px; overflow:hidden;
    box-shadow:0 0 0 1px #00000080, 0 30px 70px -25px #000, 0 0 60px -30px #c9a86a55;
    animation:rise .55s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(14px)}}
  @media (prefers-reduced-motion:reduce){ .card{animation:none} }

  /* header */
  .band{
    height:112px; position:relative;
    background:
      radial-gradient(80% 130% at 50% -20%, #c9a86a1a, transparent 65%),
      linear-gradient(180deg,#151312,#0c0c0c);
    border-bottom:1px solid var(--edge);
  }
  .band .arcs{position:absolute; inset:0; width:100%; height:100%; opacity:.5}
  .band .arcs path{fill:none; stroke:var(--gold); stroke-width:1; vector-effect:non-scaling-stroke}
  .nfc{position:absolute; top:14px; left:16px; display:flex; align-items:center; gap:6px; color:var(--gold-dim)}
  .nfc svg{width:15px; height:15px}
  .nfc span{font-size:8.5px; letter-spacing:.22em; font-weight:600}

  .avatar{
    position:absolute; left:50%; bottom:-40px; transform:translateX(-50%);
    width:96px; height:96px; border-radius:50%; overflow:hidden;
    border:1.5px solid var(--gold); background:var(--card);
    box-shadow:0 0 0 5px var(--card), 0 0 0 6px var(--edge-soft), 0 10px 26px -10px #000;
    z-index:2;
  }
  .avatar .initials{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--tint);
    font-family:"Cormorant Garamond",Georgia,serif; font-size:38px; color:var(--gold);
  }
  .avatar img{position:absolute; inset:0; z-index:1; width:100%; height:100%; object-fit:cover; display:block}

  .body{padding:60px 26px 32px; text-align:center}

  h1{
    margin:0; font-family:"Cormorant Garamond",Georgia,serif; font-weight:500;
    font-size:38px; line-height:1.05; letter-spacing:.005em; color:var(--ink);
  }
  .role{
    margin:8px 0 0; font-size:11px; font-weight:600;
    letter-spacing:.19em; text-transform:uppercase; color:var(--gold);
  }
  .org{margin:10px 0 0; font-size:13px; color:var(--muted); line-height:1.55}

  .rule{
    display:flex; align-items:center; justify-content:center; gap:10px; margin:20px 0;
  }
  .rule::before,.rule::after{content:""; height:1px; flex:1; background:linear-gradient(90deg,transparent,var(--edge))}
  .rule::after{background:linear-gradient(90deg,var(--edge),transparent)}
  .rule i{width:4px; height:4px; rotate:45deg; background:var(--gold); opacity:.7}

  .tags{display:flex; flex-wrap:wrap; justify-content:center; gap:7px}
  .tags span{
    font-size:11px; font-weight:500; letter-spacing:.04em;
    padding:6px 12px; border-radius:999px;
    background:var(--tint); border:1px solid var(--edge); color:var(--gold-hi);
  }

  .save{
    display:flex; align-items:center; justify-content:center; gap:9px;
    margin:24px 0 18px; padding:15px; border-radius:12px;
    background:linear-gradient(135deg,#f0dcae,#c9a86a 46%,#a4813c);
    color:#1b1508; text-decoration:none;
    font-size:14.5px; font-weight:650; letter-spacing:.03em;
    box-shadow:0 8px 22px -12px #c9a86acc;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .save svg{width:17px; height:17px}
  .save:active{transform:translateY(1px); box-shadow:0 4px 12px -12px #c9a86acc}

  .icons{display:flex; justify-content:center; gap:10px}
  .icons a{
    width:48px; height:48px; border-radius:12px;
    background:var(--tint); border:1px solid var(--edge); color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, border-color .12s ease, color .12s ease;
  }
  .icons a:active{transform:scale(.93); border-color:var(--gold); color:var(--gold-hi)}
  .icons svg{width:20px; height:20px}

</style>
</head>
<body>

        <path d="M-10 88 C 90 48, 250 130, 410 70"/>

      </nav>
    </div>

  </main>
</body>
</html>
